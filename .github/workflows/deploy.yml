name: "Deploy Azure Infrastructure"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
      resource_group:
        description: "Resource Group"
        required: true
        type: boolean
        default: false
      networking:
        description: "Networking (VNet + Subnets + NAT Gateway + Bastion)"
        required: true
        type: boolean
        default: false
      log_analytics:
        description: "Log Analytics"
        required: true
        type: boolean
        default: false
      acr:
        description: "Azure Container Registry (ACR)"
        required: true
        type: boolean
        default: false
      aks:
        description: "Azure Kubernetes Service (AKS)"
        required: true
        type: boolean
        default: false
      key_vault:
        description: "Key Vault"
        required: true
        type: boolean
        default: false
      storage:
        description: "Storage Account"
        required: true
        type: boolean
        default: false
      sql:
        description: "SQL Server & Database"
        required: true
        type: boolean
        default: false
      redis:
        description: "Redis Cache"
        required: true
        type: boolean
        default: false
      app_service:
        description: "App Service"
        required: true
        type: boolean
        default: false
      linux_vm:
        description: "Linux VM"
        required: true
        type: boolean
        default: false
      action:
        description: "Terraform Action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.8"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  deploy:
    name: "Terraform ${{ inputs.action }} - ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Build Target List
        id: targets
        run: |
          TARGETS=""
          if [ "${{ inputs.resource_group }}" = "true" ]; then
            TARGETS="$TARGETS -target=module.rg"
          fi
          if [ "${{ inputs.networking }}" = "true" ]; then
            TARGETS="$TARGETS -target=module.vnet"
            TARGETS="$TARGETS -target=module.subnets"
            TARGETS="$TARGETS -target=module.pip_bastion"
            TARGETS="$TARGETS -target=module.bastion"
            TARGETS="$TARGETS -target=module.pip_nat"
            TARGETS="$TARGETS -target=module.nat_gateway"
          fi
          if [ "${{ inputs.log_analytics }}" = "true" ]; then
            TARGETS="$TARGETS -target=module.log_analytics"
          fi
          if [ "${{ inputs.acr }}" = "true" ]; then
            TARGETS="$TARGETS -target=module.acr"
          fi
          if [ "${{ inputs.aks }}" = "true" ]; then
            TARGETS="$TARGETS -target=module.aks"
          fi
          if [ "${{ inputs.key_vault }}" = "true" ]; then
            TARGETS="$TARGETS -target=module.key_vault"
          fi
          if [ "${{ inputs.storage }}" = "true" ]; then
            TARGETS="$TARGETS -target=module.storage"
          fi
          if [ "${{ inputs.sql }}" = "true" ]; then
            TARGETS="$TARGETS -target=module.sql_server"
            TARGETS="$TARGETS -target=module.sql_database"
          fi
          if [ "${{ inputs.redis }}" = "true" ]; then
            TARGETS="$TARGETS -target=module.redis"
          fi
          if [ "${{ inputs.app_service }}" = "true" ]; then
            TARGETS="$TARGETS -target=module.app_service"
          fi
          if [ "${{ inputs.linux_vm }}" = "true" ]; then
            TARGETS="$TARGETS -target=module.linux_vm"
          fi
          echo "TARGETS=$TARGETS" >> $GITHUB_OUTPUT

      - name: Terraform Plan
        if: inputs.action == 'plan'
        run: terraform plan -no-color ${{ steps.targets.outputs.TARGETS }}

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -no-color ${{ steps.targets.outputs.TARGETS }}

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve -no-color ${{ steps.targets.outputs.TARGETS }}
