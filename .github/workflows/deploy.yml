name: "Interactive Terraform Environment Deployment"

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Select Target Environment"
        required: true
        options:
          - dev
          - test
          - prod
        default: dev

      action:
        type: choice
        description: "Select Terraform Action"
        required: true
        options:
          - plan
          - apply
          - destroy
        default: plan

      deploy_all:
        type: boolean
        description: "[All] Deploy Entire Environment Infrastructure"
        default: true

      deploy_network:
        type: boolean
        description: "[Select] Network (VNet & Subnets)"
        default: false

      deploy_aks:
        type: boolean
        description: "[Select] Kubernetes Cluster (AKS)"
        default: false

      deploy_acr:
        type: boolean
        description: "[Select] Container Registry (ACR)"
        default: false

      deploy_key_vault:
        type: boolean
        description: "[Select] Key Vault"
        default: false

      deploy_sql:
        type: boolean
        description: "[Select] Database (SQL Server & DB)"
        default: false

      deploy_storage:
        type: boolean
        description: "[Select] Storage Account"
        default: false

      deploy_bastion:
        type: boolean
        description: "[Select] Bastion Host"
        default: false

      deploy_nat_gateway:
        type: boolean
        description: "[Select] NAT Gateway"
        default: false

      deploy_redis:
        type: boolean
        description: "[Select] Redis Cache"
        default: false

      deploy_app_service:
        type: boolean
        description: "[Select] App Service & Plan"
        default: false

      deploy_linux_vm:
        type: boolean
        description: "[Select] Linux Virtual Machine (with Public IP)"
        default: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Terraform ${{ inputs.action }} [${{ inputs.environment }}]"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "environments/${{ inputs.environment }}"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Construct Dynamic Target Flags
        id: targets
        run: |
          TARGET_FLAGS=""

          if [ "${{ inputs.deploy_all }}" = "false" ]; then
            if [ "${{ inputs.deploy_network }}" = "true" ]; then
              TARGET_FLAGS="$TARGET_FLAGS -target=module.vnet -target=module.subnet_bastion -target=module.subnet_aks -target=module.subnet_backend -target=module.subnet_pe -target=module.subnet_appservice"
            fi
            if [ "${{ inputs.deploy_aks }}" = "true" ]; then
              TARGET_FLAGS="$TARGET_FLAGS -target=module.aks"
            fi
            if [ "${{ inputs.deploy_acr }}" = "true" ]; then
              TARGET_FLAGS="$TARGET_FLAGS -target=module.acr"
            fi
            if [ "${{ inputs.deploy_key_vault }}" = "true" ]; then
              TARGET_FLAGS="$TARGET_FLAGS -target=module.key_vault"
            fi
            if [ "${{ inputs.deploy_sql }}" = "true" ]; then
              TARGET_FLAGS="$TARGET_FLAGS -target=module.sql_server -target=module.sql_database"
            fi
            if [ "${{ inputs.deploy_storage }}" = "true" ]; then
              TARGET_FLAGS="$TARGET_FLAGS -target=module.storage"
            fi
            if [ "${{ inputs.deploy_bastion }}" = "true" ]; then
              TARGET_FLAGS="$TARGET_FLAGS -target=module.pip_bastion -target=module.bastion"
            fi
            if [ "${{ inputs.deploy_nat_gateway }}" = "true" ]; then
              TARGET_FLAGS="$TARGET_FLAGS -target=module.pip_nat -target=module.nat_gateway"
            fi
            if [ "${{ inputs.deploy_redis }}" = "true" ]; then
              TARGET_FLAGS="$TARGET_FLAGS -target=module.redis"
            fi
            if [ "${{ inputs.deploy_app_service }}" = "true" ]; then
              TARGET_FLAGS="$TARGET_FLAGS -target=module.app_service"
            fi
            if [ "${{ inputs.deploy_linux_vm }}" = "true" ]; then
              TARGET_FLAGS="$TARGET_FLAGS -target=module.linux_vm"
            fi
          fi

          echo "Selected Target Flags: ${TARGET_FLAGS}"
          echo "target_flags=${TARGET_FLAGS}" >> $GITHUB_OUTPUT

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan
        if: ${{ inputs.action == 'plan' }}
        run: |
          terraform plan -var-file="terraform.tfvars" ${{ steps.targets.outputs.target_flags }}

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        run: |
          terraform apply -var-file="terraform.tfvars" ${{ steps.targets.outputs.target_flags }} -auto-approve

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        run: |
          terraform destroy -var-file="terraform.tfvars" ${{ steps.targets.outputs.target_flags }} -auto-approve
